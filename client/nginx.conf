server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The "server" hostname is resolved via Docker Compose's internal network
    # (the backend service is named "server" in docker-compose.yml).
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Single-page app: any other path falls back to index.html so client-side
    # routing (and plain page refreshes) keep working.
    location / {
        try_files $uri /index.html;
    }
}
